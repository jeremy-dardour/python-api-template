version: 2
updates:
  # Python dependencies resolved from uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      patch-updates:
        update-types:
          - patch

      minor-updates:
        update-types:
          - minor

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: wednesday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"