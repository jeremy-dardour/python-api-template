[project]
name = "python-api-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]


[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
extend-exclude = [
    "standards/",
]
show-fixes = true


[tool.ruff.lint]

select = [
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "E",      # pycodestyle errors
  "FA",     # flake8-future-annotations
  "F",      # pyflakes
  "G",      # flake8-logging-format
  "I",      # isort
  "LOG",    # flake8-logging
  "PL",     # pylint
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RUF",    # ruff-specific rules
  "TCH",    # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # pycodestyle warnings
  "SIM",    # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
