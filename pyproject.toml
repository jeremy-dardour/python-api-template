[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project]
name = "python-api-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.7",
    "ruff>=0.15.16",
]


[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
extend-exclude = [
    "standards/",
]
show-fixes = true


[tool.ruff.lint]

select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear — common bug patterns
    "C4",    # comprehension improvements
    "UP",    # pyupgrade — modernize syntax
    "ANN",   # enforce annotations
    "S",     # bandit — security
    "SIM",   # simplify
    "TCH",   # type-checking import hygiene
    "RUF",   # ruff-specific rules
    "T20",   # no print statements
    "N",     # pep8 naming
    "FAST",  # FastAPI-specific rules
    "ERA",   # no commented-out code
]
ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["src"]
