[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project]
name = "python-api-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic-settings>=2.14.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "httpx>=0.28.1",
    "prek>=0.4.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
]


[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
extend-exclude = [
    "docs/",
]
show-fixes = true


[tool.ruff.lint]

select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear — common bug patterns
    "C4",    # comprehension improvements
    "UP",    # pyupgrade — modernize syntax
    "ANN",   # enforce annotations
    "S",     # bandit — security
    "SIM",   # simplify
    "TCH",   # type-checking import hygiene
    "RUF",   # ruff-specific rules
    "T20",   # no print statements
    "N",     # pep8 naming
    "FAST",  # FastAPI-specific rules
    "ERA",   # no commented-out code
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["src", "tests"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.coverage.run]
# Required by the CI coverage-comment action to resolve file paths.
relative_files = true
